[project]
name = "thordata-serp-dify"
version = "0.1.1"
description = "Dify tools for live, structured search through the Thordata SERP API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dify-plugin>=0.10.2,<0.11.0",
    "requests>=2.32,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pyyaml>=6,<7",
    "responses>=0.25,<1",
    "ruff>=0.13,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
