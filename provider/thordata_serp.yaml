identity:
  author: thordata
  name: thordata_serp
  label:
    en_US: Thordata SERP
  description:
    en_US: Search the web with live, structured results from the Thordata SERP API.
  icon: icon.svg
  icon_dark: icon-dark.svg
  tags:
  - search
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: API Key
    placeholder:
      en_US: Enter your Thordata SERP API key
    help:
      en_US: Create or manage your API key in the Thordata dashboard.
    url: https://doc.thordata.com
